<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice A1</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:24px; background:#f5f7fb; color:#1f2a44; }
    .container { max-width: 860px; margin: 0 auto; background:#fff; padding:24px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .task { margin:12px 0; padding:12px; border:1px solid #e4e8f1; border-radius:10px; }
    .task label { cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
    .controls { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
    button { padding:10px 16px; border:none; border-radius:10px; background:#2f6fed; color:#fff; cursor:pointer; font-weight:700; }
    .secondary { background:#5f6f91; }
    .result { margin-top:16px; padding:14px; border-radius:10px; background:#f0f4ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Practice A1</h1>
    <p><strong>Тема:</strong> «Пишется А на месте пропуска в словах».</p>
    <p>Выберите слова, где на месте пропуска пишется буква <strong>А</strong>. В каждом наборе правильных ответов — от 2 до 4.</p>

    <div id="tasks"></div>

    <div class="controls">
      <button id="checkBtn">Проверить</button>
      <button id="newSetBtn" class="secondary">Новый набор</button>
      <a href="practice.html" class="secondary" style="text-decoration:none; padding:10px 16px; border-radius:10px; color:white; font-weight:700;">Назад к карточкам</a>
    </div>

    <div id="result" class="result" hidden></div>
  </div>

  <script src="practiceA1.js"></script>
</body>
</html>
