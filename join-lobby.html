<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Examix — Подключение к лобби</title><link rel="stylesheet" href="./assets/css/lobby.css"/></head>
<body><main class="page-wrap"><section class="panel"><h1>Присоединиться к лобби</h1><p class="muted">Подключение по коду теперь работает через Supabase в основном приложении.</p><div class="grid"><div><label for="code">Код комнаты</label><input id="code" required/></div><div class="row"><button id="joinButton" class="button button-primary">Перейти к подключению</button><a class="button" href="./lobby/index.html">Открыть страницу лобби</a></div><p id="err" class="error"></p></div></section></main>
<script type="module">const q=new URLSearchParams(location.search);const codeInput=document.getElementById('code');codeInput.value=(q.get('code')||'').trim();document.getElementById('joinButton').addEventListener('click',()=>{const code=codeInput.value.trim();if(!code){document.getElementById('err').textContent='Введите код комнаты';return;}location.href=`./lobby/index.html?code=${encodeURIComponent(code.toUpperCase())}`;});</script></body></html>
