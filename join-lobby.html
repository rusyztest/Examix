<!doctype html><html lang='ru'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Подключение к лобби</title><link rel='stylesheet' href='/assets/css/lobby.css'/></head><body><main class='page-wrap'><section class='panel'><h1>Присоединиться к лобби</h1><div class='grid'><div><label>Код лобби</label><input id='code'/></div><div><label>Ник</label><input id='nick'/></div><div class='row'><button id='join' class='button button-primary'>Подключиться</button></div><p id='err' class='error'></p></div></section><section id='info' class='panel hidden'><h3>Параметры лобби</h3><p class='muted' id='meta'></p><div><h4>Участники</h4><div id='list' class='list'></div></div><a id='go' class='button button-primary'>Войти в комнату</a></section></main><script type='module'>import {joinLobby} from '/assets/js/lobby-manager.js';import {getLobby} from '/assets/js/storage.js';const q=new URLSearchParams(location.search);document.getElementById('code').value=q.get('code')||'';const render=l=>{document.getElementById('info').classList.remove('hidden');document.getElementById('meta').textContent=`Время: ${l.timeLimit} мин • Режим: ${l.mode}`;document.getElementById('list').innerHTML=l.players.map(p=>`<div class='list-item'>${p.nickname}</div>`).join('');document.getElementById('go').href=`/lobby.html?code=${l.code}`};document.getElementById('join').onclick=()=>{const code=document.getElementById('code').value.trim().toUpperCase();const nick=document.getElementById('nick').value.trim();const res=joinLobby(code,nick);document.getElementById('err').textContent=res.error||'';if(!res.error) render(getLobby(code));};if(q.get('code')){const l=getLobby(q.get('code')); if(l) render(l);}window.addEventListener('storage',()=>{const c=document.getElementById('code').value.trim();if(c){const l=getLobby(c);if(l)render(l);}});</script></body></html>
