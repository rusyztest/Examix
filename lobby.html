<!doctype html><html lang='ru'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Лобби</title><link rel='stylesheet' href='/assets/css/lobby.css'/></head><body><main class='page-wrap'><section class='panel'><h1>Лобби <span id='code'></span></h1><p id='status' class='muted'></p><div id='players' class='list'></div><button id='start' class='button button-primary'>Начать игру</button></section><section id='game' class='panel hidden'><div class='row'><div class='timer' id='timer'></div><button id='finish' class='button'>Завершить и показать результат</button></div><div id='tasks' class='grid'></div></section></main><script type='module'>import {getLobby} from '/assets/js/storage.js';import {startLobby} from '/assets/js/lobby-manager.js';import {answerKey,getTaskIds,finishGame} from '/assets/js/game-state.js';const qs=new URLSearchParams(location.search);const code=(qs.get('code')||'').toUpperCase();const lobby=getLobby(code);if(!lobby){location.href='/join-lobby.html';}document.getElementById('code').textContent=code;const render=()=>{const l=getLobby(code);document.getElementById('status').textContent=`Режим: ${l.mode} • Время: ${l.timeLimit} мин`;document.getElementById('players').innerHTML=l.players.map(p=>`<div class='list-item'>${p.nickname}${p.finished?' ✅':''}</div>`).join('');if(l.started) startGame(l);};const startGame=l=>{document.getElementById('game').classList.remove('hidden');const ids=getTaskIds(l.mode);document.getElementById('tasks').innerHTML=ids.map(id=>`<div><label>${id}</label><input data-id='${id}' placeholder='Ответ'/></div>`).join('');let left=Math.max(0,l.timeLimit*60-Math.floor((Date.now()-l.startedAt)/1000));const t=setInterval(()=>{left--;document.getElementById('timer').textContent=`Осталось: ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(t);submit();}},1000);document.getElementById('finish').onclick=submit;function submit(){const answers={};document.querySelectorAll('input[data-id]').forEach(i=>answers[i.dataset.id]=i.value);finishGame(code,'player',answers);location.href=`/results.html?code=${code}`;}};document.getElementById('start').onclick=()=>{startLobby(code);render();};render();window.addEventListener('storage',render);</script></body></html>
