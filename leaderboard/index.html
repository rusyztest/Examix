<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Examix — Рейтинг</title>
    <style>
      :root { color-scheme: light dark; --bg:#f8fafc; --surface:rgba(255,255,255,.9); --text:#0f172a; --muted:#64748b; --primary:#635bff; --accent:#06b6d4; --border:rgba(15,23,42,.1); --shadow:0 24px 80px rgba(79,70,229,.16); }
      @media (prefers-color-scheme: dark) { :root { --bg:#050816; --surface:rgba(15,23,42,.9); --text:#e2e8f0; --muted:#94a3b8; --border:rgba(226,232,240,.12); } }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top left,rgba(99,91,255,.22),transparent 34rem),var(--bg); } a { color:inherit; text-decoration:none; }
      .container { width:min(960px,calc(100% - 32px)); margin:0 auto; } .header { border-bottom:1px solid var(--border); backdrop-filter:blur(18px); background:color-mix(in srgb,var(--bg) 84%,transparent); } .nav { display:flex; min-height:72px; align-items:center; justify-content:space-between; gap:20px; } .brand { display:inline-flex; align-items:center; gap:12px; font-weight:800; } .brand-mark { display:grid; width:42px; height:42px; place-items:center; border-radius:15px; color:white; background:linear-gradient(135deg,var(--primary),var(--accent)); box-shadow:var(--shadow); }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px; border:1px solid var(--border); border-radius:999px; font-weight:700; background:var(--surface); } .button-primary { color:white; border-color:transparent; background:linear-gradient(135deg,var(--primary),#4f46e5); box-shadow:var(--shadow); }
      main { padding:72px 0; } .card { border:1px solid var(--border); border-radius:30px; padding:34px; background:var(--surface); box-shadow:0 10px 30px rgba(15,23,42,.05); animation:fade-up .65s ease both; } h1 { margin:0; font-size:clamp(40px,7vw,72px); letter-spacing:-.07em; line-height:.98; } p { color:var(--muted); font-size:18px; line-height:1.65; } .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; } @keyframes fade-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

    </style>
  </head>
  <body>
    <header class="header"><nav class="container nav"><a class="brand" href="/"><span class="brand-mark">Э</span><span>Examix</span></a><a class="button" href="/practice">Тренировки</a></nav></header>
    <main class="container">
      <section class="card">
        <h1>Рейтинг</h1>
        <p>Таблица результатов учеников и групповых лобби.</p>
        <div class="actions">
          <a class="button button-primary" href="/practice/a1">Открыть А1 тест</a>
          <a class="button" href="/practice">Все тренировки</a>
          <a class="button" href="/">На главную</a>
        </div>
      </section>
    </main>
  </body>
</html>
