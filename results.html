<!doctype html><html lang='ru'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Результаты</title><link rel='stylesheet' href='/assets/css/lobby.css'/></head><body><main class='page-wrap'><section class='panel'><h1>Результаты лобби <span id='code'></span></h1><div id='summary'></div><h3>Подробно</h3><div id='details' class='list'></div></section></main><script type='module'>import {getResults} from '/assets/js/storage.js';const code=(new URLSearchParams(location.search).get('code')||'').toUpperCase();document.getElementById('code').textContent=code;const data=getResults(code);if(!data.length){document.getElementById('summary').textContent='Нет результатов';}else{const last=data[data.length-1];const s=last.summary;document.getElementById('summary').innerHTML=s.test!==undefined?`<p>Первичный: ${s.primary}, тестовый: ${s.test}</p>`:`<p>Процент: ${s.percent}%</p>`;document.getElementById('details').innerHTML=last.results.map(r=>`<div class='list-item'><b>${r.id}</b>: ваш ответ «${r.user||'—'}», верный «${r.correct}», баллы ${r.points}</div>`).join('');}</script></body></html>
