<!doctype html><html lang='ru'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Создание лобби</title><link rel='stylesheet' href='/assets/css/lobby.css'/></head><body><main class='page-wrap'><section class='panel'><h1>Создать лобби</h1><div class='grid grid-2'><div><label>Время (мин)</label><input id='time' type='number' value='120' min='5' max='240'/></div><div><label>Участников</label><input id='players' type='number' value='10' min='2' max='100'/></div></div><label>Режим заданий</label><div class='radio-group'><label class='radio-card'><input type='radio' name='mode' value='all' checked/>Все задания</label><label class='radio-card'><input type='radio' name='mode' value='partA'/>Только часть А</label><label class='radio-card'><input type='radio' name='mode' value='partB'/>Только часть В</label></div><div class='row'><button id='create' class='button button-primary'>Создать</button><a class='button' href='/join-lobby.html'>Присоединиться</a></div><p id='msg'></p><div id='created' class='hidden'><p>Код: <span class='code' id='code'></span></p><p>Ссылка: <a id='invite'></a></p><a id='openLobby' class='button button-primary'>Открыть лобби</a></div></section></main><script type='module'>import {createLobby} from '/assets/js/lobby-manager.js';const $=id=>document.getElementById(id);$('create').onclick=()=>{const mode=[...document.querySelectorAll('[name=mode]')].find(i=>i.checked).value;const lobby=createLobby({timeLimit:$('time').value,maxPlayers:$('players').value,mode});const link=`${location.origin}/lobby.html?code=${lobby.code}`;$('created').classList.remove('hidden');$('code').textContent=lobby.code;$('invite').textContent=link;$('invite').href=`/join-lobby.html?code=${lobby.code}`;$('openLobby').href=`/lobby.html?code=${lobby.code}`;};</script></body></html>
